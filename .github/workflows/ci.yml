name: CI Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:

  checkout:
    name: Checkout Code
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.get_sha.outputs.commit_sha }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Get Commit SHA
        id: get_sha
        run: echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: checkout
    steps:
      - uses: actions/checkout@v4

      - name: Make build.sh executable
        run: chmod +x ./build.sh

      - name: Run Build Script
        run: ./build.sh

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Make test.sh executable
        run: chmod +x ./test.sh

      - name: Run Test Script
        run: ./test.sh

  deploy:
    name: Simulate Deployment
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Deployment simulation start
        run: echo "🚀 Starting deployment simulation..."

      - name: Display build artifacts (if any)
        run: |
          echo "Checking for build artifacts:"
          ls -la ./ || echo "No build artifacts found."

      - name: Simulate deployment wait
        run: sleep 5

      - name: Deployment simulation complete
        run: echo "✅ Deployment simulation finished (no real server deployed)."
